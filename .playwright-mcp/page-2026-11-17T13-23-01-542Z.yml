              - paragraph [ref=e1908]: I disordini per le vie del centro di Milano hanno svelato il disagio e il rancore di una generazione di giovanissimi provenienti dall'hinterland e dai quartieri poveri. 'Spacchiamo perché altrimenti nessuno ci dà retta', dicono in molti. Ora dietro alle loro spalle resta solo devastazione. Non c'è un ideale comune e spesso i discorsi girano intorno alla questione del denaro che manca. Tik Tok e Instagram sono gli aggregatori, i reel la loro finestra sui sogni. C'è chi parla di solitudine e chi di apatia. Ma lontano dal centro della città ci sono anche coloro che, nonostante la crisi, non si rassegnano e lavorano per costruire relazioni reali e ambizioni concrete
