# tentacle-relay — APNs push (docs/feat/mobile-push.md P10 / C2, F4)
#
# A systemd DROP-IN, installed ONLY together with Apple's key:
#   /etc/systemd/system/relay.service.d/apns.conf
# The runbook installs and removes it as one step with the `.p8`
# (docs/ops/relay-deploy.md §6.1 / §6.3). Without this file `relay.service` is
# unchanged, starts with push off, and announces no `push` in `ready.features` —
# which is why a host that has never seen an Apple key still serves every phone.
#
# WHY A DROP-IN AND NOT THE UNIT (review round 1, finding 1). Both lines below
# make the unit UNABLE TO START on a host where the key is not where they say:
#   - `LoadCredential=` with an ABSOLUTE path: systemd fails the unit's start
#     (exit 243/CREDENTIALS) when that file is missing — it does not degrade to
#     "no credential";
#   - `--apns-key-id ${TENTACLE_RELAY_APNS_KEY_ID}`: systemd expands an unknown
#     variable to the EMPTY string and a `${VAR}` word is always exactly ONE
#     argument (systemd.service(5)), so an unset id arrives as `--apns-key-id ""`.
# With `Restart=always` either one is a crash loop, i.e. every phone loses the
# relay because a key was absent. In a drop-in, the same failure is a push-only
# misconfiguration an operator fixes by removing one file — and the binary is
# lenient about a blank `--apns-*` value anyway (`parseRelayArgs`), so a drop-in
# installed a moment before `apns.conf` still boots, with push off.

[Service]
# A drop-in does not REPLACE the base unit's command line, it is appended to it.
# `Type=simple` (relay.service) allows exactly one `ExecStart=`, so the line below
# MUST be preceded by an empty `ExecStart=` — that is what clears the inherited
# list (systemd.service(5): "if the empty string is assigned to this option, the
# list of commands to execute is reset"). Without it systemd sees TWO command
# lines and refuses the whole unit ("more than one ExecStart= setting, which is
# only allowed for Type=oneshot services. Refusing."), so installing push would
# fail the restart and take every phone off the relay — the very outcome this
# drop-in exists to avoid (review round 2, finding 1).
ExecStart=
# The restated command line, so every base flag moves with it — above all
# `--trust-proxy`: a drop-in that lost it would collapse every client back into
# ONE per-IP bucket behind Caddy (relay.service). `deploy.test.ts` pins that it is
# byte-for-byte the base argv plus the four push flags, so the two files cannot
# drift apart.
ExecStart=/opt/tentacle-relay/tentacle-relay --host 127.0.0.1 --port 4100 --trust-proxy \
    --apns-key-file ${CREDENTIALS_DIRECTORY}/apns-key \
    --apns-key-id ${TENTACLE_RELAY_APNS_KEY_ID} \
    --apns-team-id ${TENTACLE_RELAY_APNS_TEAM_ID} \
    --apns-topic so.tentacle.app

# THE ONE SECRET ON THIS HOST: the APNs auth key (`.p8`). It arrives as a systemd
# CREDENTIAL, so the relay user never has a readable copy: systemd opens the 0400
# root file, copies it into a read-only per-unit directory, and ExecStart names
# only `${CREDENTIALS_DIRECTORY}/apns-key` (systemd.exec(5)). The `.p8` itself is
# never in argv (world-readable in `ps`), never in a unit file, and never in the
# repo (decision 18).
LoadCredential=apns-key:/etc/tentacle-relay/apns-key.p8

# The key id and team id are NOT secrets (they travel in the JWT header Apple
# already sees) and come from an operator file, so no Apple account detail lands
# in the repo. The leading `-` keeps the file optional: if it is missing both
# variables are empty, `readApnsKeySource` refuses the partial set, and the relay
# logs one `push off: …` line and serves as before (F4).
#   600 root:relay  /etc/tentacle-relay/apns.conf
#     TENTACLE_RELAY_APNS_KEY_ID=ABC123DEFG
#     TENTACLE_RELAY_APNS_TEAM_ID=TEAM123456
EnvironmentFile=-/etc/tentacle-relay/apns.conf
