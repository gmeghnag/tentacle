appId: so.tentacle.app
---
# 18 (docs/feat/mobile-compose.md 13d): PHOTOS from the library. Two fixtures are in the
# simulator's library (`simctl addmedia`: a PNG and a JPEG — the HEIC leg is proved by
# 13c's Step 0, where PHPicker returned a real HEIC and the phone converted it), both
# chips become ready, and the daemon's history names both refs with their types.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${PHOTO_ID}"
    direction: DOWN
- tapOn:
    id: "session-${PHOTO_ID}"
- assertVisible:
    id: "session-view"
- tapOn:
    id: "composer-input"
- inputText: "PHOTO eighteen"
- hideKeyboard
- tapOn:
    id: "composer-photo"
# The alert's button reads "Photo Library" (`SessionScreen`'s `Alert.alert`);
# Maestro's text is a FULL regex match, so "Library" alone finds nothing.
- tapOn:
    text: "Photo Library"
# PHPicker: the two fixtures, then confirm. iOS 26's picker names a cell
# "Photo, <date>, <time>", not by its file name, so the flow takes the two
# NEWEST cells: this run's `addmedia` pair (one PNG + one JPEG, one timestamp).
# The regex is a full match with exactly two commas, so the grid's container
# (every cell's label joined) never matches. The confirm is "Done" on iOS 26
# (a checkmark) and "Add" on iOS 18.
- tapOn:
    text: "Photo, [^,]+, [^,]+"
    index: 0
- tapOn:
    text: "Photo, [^,]+, [^,]+"
    index: 1
- tapOn:
    text: "Done|Add"
- extendedWaitUntil:
    visible:
      id: "chip-0-ready"
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: "chip-1-ready"
    timeout: 40000
- tapOn:
    id: "composer-send"
- runScript:
    file: "18-photos.js"
