appId: so.tentacle.app
tags:
  - quarantine
# quarantine: `notify-respond` injects the response through a file the app reads in DEV builds only (App.tsx `if (__DEV__)`, Owner Q7: never in the shipped build), and the gate installs the shippable Release, so the injected action never reaches the app (docs/fix/mobile-e2e-reds.md); run it against a dev build, or on a device (README D3)
---
# `22-notify-forged` (docs/feat/mobile-notifications.md N8): the security property
# of the whole task, end to end.
#
#
# WHAT THIS CANNOT PROVE: the action button on the SYSTEM banner and the NSE that
# would draw it — both need a device build (owner step D3a), so the response is
# injected (Owner Q7). The REFUSAL itself is in `bun test`
# (`notification-action.test.ts`), which is what makes this flow's daemon truth
# meaningful rather than incidental.
#
# A push sealed by a key that is NOT the pinned computer's — with a perfectly
# plausible `userInfo.tn` naming a real session and a real `requestId` — must
# answer NOTHING. The app re-opens the seal, HPKE Auth refuses it (the pinned key
# is the identity), and the ask is STILL PENDING on the daemon.
#
# The negative assertion is DAEMON truth (`pending`), not a screen: a flow that
# asserted "the sheet is still there" would pass on a stale frame.
- runFlow: _pair.yaml
- assertVisible:
    id: "computers-list"
- tapOn:
    id: "computer-${output.computerId}"
- extendedWaitUntil:
    visible:
      id: "sessions-list"
    timeout: 30000
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${ASK1_ID}"
    direction: DOWN
- tapOn:
    id: "session-${ASK1_ID}"
- assertVisible:
    id: "session-view"
- tapOn:
    id: "composer-input"
- inputText: "EDIT a.txt"
- hideKeyboard
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    visible:
      id: "perm-sheet"
    timeout: 20000
# Seal a notification about the REAL ask, but with a NON-pinned sender key.
- runScript:
    file: "22-notify-seal-forged.js"
# Approve it: the app must refuse `unverified` and send nothing — so it must NOT
# raise Face ID either (there is nothing to authenticate an answer to).
- runScript:
    file: "22-notify-respond.js"
    env:
      MAESTRO_NOTIFY_ACTION: "approve"
# The sheet is still up (the ask was never answered)...
- assertVisible:
    id: "perm-sheet"
# ...and DAEMON truth: the ask is STILL pending. The truth check is LAST: an id
# only says what the app drew (plan P9).
- runScript:
    file: "22-notify-assert.js"
    env:
      MAESTRO_NOTIFY_EXPECT: "pending"
