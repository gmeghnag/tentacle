appId: so.tentacle.app
---
# One `RUNROW38` turn (flow 38, docs/fix/mobile-running-row.md), shot as
# `${PHASE}-running`, `${PHASE}-thinking`, `${PHASE}-detail` (light + dark).
- tapOn:
    id: "composer-input"
- inputText: "RUNROW38"
- hideKeyboard
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    visible:
      id: "perm-sheet"
    timeout: 20000
- tapOn:
    id: "perm-allow_once"
# The described shell runs ~20 s (both appearances shot while it runs): the live row (sentence + running node).
- extendedWaitUntil:
    visible:
      id: "tool-mocked-.*-running"
    timeout: 20000
- assertVisible:
    id: "tool-mocked-.*-running"
    text: "Test DNS con 50 query e latenze misurate.*"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "${PHASE}-running"
- extendedWaitUntil:
    visible:
      id: "thinking-footer"
    timeout: 30000
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "${PHASE}-thinking"
- extendedWaitUntil:
    visible:
      id: "turn-idle"
    timeout: 40000
# The tap detail: the command and the output — never the folded thought.
- tapOn:
    id: "tool-mocked-.*-ok"
    index: -1
- extendedWaitUntil:
    visible:
      id: "tool-mocked-.*-output"
    timeout: 5000
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "${PHASE}-detail"
- assertNotVisible:
    text: ".*Measure the resolver latency.*"
- tapOn:
    id: "tool-mocked-.*-ok"
    index: -1
