appId: so.tentacle.app
---
# 28 (docs/feat/mobile-chrome.md slice S10): the floating Activity button, opt-in.
# Settings → Activity button → Floating; the mock model's `AGENTS27` launches a
# background child (60 slow steps, so it outlives the relaunch below).
#
# Driven: the floating button appears and the header pill does not; a drag
# starting ON the button moves it to the left edge (F21: a touch that starts on
# the button is the button's); a relaunch brings it back on the left (the
# Keychain record); a tap opens the hub fan (feat/mobile-hub-tap) and a tap
# outside it closes it; the keyboard up keeps it above the
# composer (F20); Settings → Header → the pill is back, no floating button.
#
# Edge positions are asserted relative to the centred title (`leftOf`/`rightOf`
# `session-title`): Maestro asserts no coordinates.
#
# Not driven here (stated, not hidden): the left-edge back-swipe with the button
# on the left (F21) — Maestro has no iOS edge gesture (flows 05/26 say the same);
# VoiceOver and Reduce Motion (F23) — Maestro cannot toggle them reliably;
# `floating-button.test.ts` pins both rules. feat/mobile-hub-center adds two more:
# the CENTRE drop (Maestro swipes from an element only in a direction — it ends
# near a screen edge — or between fixed percentages, and the button's y is not
# known in advance) and the scroll dim (2 B: Maestro reads neither opacity nor
# sub-second timing). Both are pinned by `floating-button.test.ts` /
# `hub-scroll-dim.test.ts` and checked on the simulator in the task's Execution.
- runFlow: _pair.yaml
- extendedWaitUntil:
    visible:
      id: "computers-list"
    timeout: 30000
- tapOn:
    id: "open-settings"
- tapOn:
    id: "activity-button-floating"
# feat/mobile-hub-center, owner 6: the list-end switch belongs to the FLOATING
# button, so it exists in exactly this state (and not with the header pill, below).
- assertVisible:
    id: "activity-list-end"
- tapOn:
    id: "settings-back"
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${FLOAT_ID}"
    direction: DOWN
- tapOn:
    id: "session-${FLOAT_ID}"
- assertVisible:
    id: "session-view"
- tapOn:
    id: "composer-input"
- inputText: "AGENTS27"
- hideKeyboard
- tapOn:
    id: "composer-send"
# The button carries the count; the header pill is not drawn ("Floating" replaces it).
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- assertNotVisible:
    id: "session-activity"
# Its default spot: the right edge.
- assertVisible:
    id: "floating-activity"
    rightOf:
      id: "session-title"
# Drag it into the left half: it snaps to the left edge.
- swipe:
    from:
      id: "floating-activity"
    direction: LEFT
- assertVisible:
    id: "floating-activity"
    leftOf:
      id: "session-title"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "28-floating-left"
# Keyboard up: the band shrinks, the button stays above the composer (F20).
- tapOn:
    id: "composer-input"
- assertVisible:
    id: "floating-activity"
    above:
      id: "composer-input"
- hideKeyboard
# Kill and relaunch: it comes back on the left (the stored edge).
- launchApp
- runFlow: _unlock.yaml
- extendedWaitUntil:
    visible:
      id: "computer-${output.computerId}"
    timeout: 30000
- tapOn:
    id: "computer-${output.computerId}"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${FLOAT_ID}"
    direction: DOWN
- tapOn:
    id: "session-${FLOAT_ID}"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- assertVisible:
    id: "floating-activity"
    leftOf:
      id: "session-title"
# A tap on the floating button opens the hub fan, not the Activity sheet
# (feat/mobile-hub-tap); Activity is one of its items.
- tapOn:
    id: "floating-activity"
- extendedWaitUntil:
    visible:
      id: "hub-scrim"
    timeout: 5000
- tapOn:
    point: "30%,40%"
- assertNotVisible:
    id: "hub-scrim"
# Back to Header: the pill returns, the floating button is gone.
- tapOn:
    id: "session-drawer"
- tapOn:
    id: "drawer-settings"
- tapOn:
    id: "activity-button-header"
# …and the row is gone with the button it configures (feat/mobile-hub-center D7).
- assertNotVisible:
    id: "activity-list-end"
- tapOn:
    id: "settings-back"
- extendedWaitUntil:
    visible:
      id: "session-activity"
    timeout: 20000
- assertNotVisible:
    id: "floating-activity"
