appId: so.tentacle.app
---
# 34-hub-sessions (docs/feat/mobile-e2e-gate.md): More → Sessions opens the
# sessions drawer, with this session as the current row.
# The shared prefix: pair, open this flow's own session, wait for the hub.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${HUBITEM_ID}"
    direction: DOWN
- tapOn:
    id: "session-${HUBITEM_ID}"
- assertVisible:
    id: "session-view"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- runFlow:
    file: _hub-more.yaml
    env:
      ITEM: "sessions"
- tapOn:
    id: "hub-menu-sessions"
- extendedWaitUntil:
    visible:
      id: "drawer"
    timeout: 5000
- assertVisible:
    id: "drawer-current-${HUBITEM_ID}"
