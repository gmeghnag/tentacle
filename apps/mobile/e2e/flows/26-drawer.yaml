appId: so.tentacle.app
---
# 26 (docs/feat/mobile-chrome.md slice S6): the sessions drawer. The hamburger
# opens it over the session, the open session is the highlighted row, a long-
# press renames a row BY ID (no open), and a tap on another row switches the
# session screen to it.
#
# Assertions are by testID only (plan P9), and the flow ENDS on daemon truth:
# `26-drawer.js` reads the drawer's rename through `session/list`, and that the
# session the drawer switched AWAY from still exists (a switch only detaches,
# never `session/close` — F6).
#
# Not driven here (stated, not hidden): the cross-computer switch and its back
# stack (the harness runs ONE `serve`; `drawer-nav.test.ts` pins F4's stack),
# the edge back-swipe (Maestro has no iOS edge gesture), and New session (S7).
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
- tapOn:
    id: "session-${DRAWER_ID}"
- assertVisible:
    id: "session-view"
# F1: the hamburger TAP is the only opener.
- tapOn:
    id: "session-drawer"
- assertVisible:
    id: "drawer"
# F3: the open session is highlighted by id.
- assertVisible:
    id: "drawer-current-${DRAWER_ID}"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "26-drawer"
# F7: long-press → Rename → `session/rename` by id; the field closes on success.
- longPressOn:
    id: "drawer-current-${DRAWER_ID}"
- tapOn:
    id: "drawer-row-rename"
- assertVisible:
    id: "session-rename-input"
- tapOn:
    id: "session-rename-input"
- eraseText
- inputText: "Renamed in drawer 26"
- tapOn:
    id: "session-rename-save"
- waitForAnimationToEnd
- assertNotVisible:
    id: "session-rename-sheet"
# The switch: another row of the same computer → the screen is THAT session
# (re-opening the drawer highlights it, not the one we left).
- tapOn:
    id: "drawer-session-${ALPHA_ID}"
- assertVisible:
    id: "session-view"
- tapOn:
    id: "session-drawer"
- assertVisible:
    id: "drawer-current-${ALPHA_ID}"
- tapOn:
    id: "drawer-scrim"
- assertNotVisible:
    id: "drawer"
# The daemon truth: the rename landed and the left session is still there.
- runScript:
    file: "26-drawer.js"
