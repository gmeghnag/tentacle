appId: so.tentacle.app
---
# 34-hub-commands (docs/feat/mobile-e2e-gate.md): the fan's Commands opens the
# session's Commands sheet (`commands-sheet`, docs/feat/mobile-hub-commands.md C3).
# The shared prefix: pair, open this flow's own session, wait for the hub.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${HUBITEM_ID}"
    direction: DOWN
- tapOn:
    id: "session-${HUBITEM_ID}"
- assertVisible:
    id: "session-view"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- runFlow:
    file: _hub-fan.yaml
    env:
      ITEM: "commands"
- tapOn:
    id: "hub-item-commands"
- extendedWaitUntil:
    visible:
      id: "commands-sheet"
    timeout: 5000
