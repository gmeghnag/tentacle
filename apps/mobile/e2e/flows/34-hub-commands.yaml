appId: so.tentacle.app
tags:
  - known-bug
# known-bug: the fan's Commands disc is a no-op tap — `commandsOpen` (SessionScreen.tsx) is set but no sheet reads it; mobile-hub-commands C3 (the sheet) is not merged
---
# 34-hub-commands (docs/feat/mobile-e2e-gate.md): the fan's Commands opens the
# session's Commands sheet (`commands-sheet`, docs/feat/mobile-hub-commands.md C3).
# The shared prefix: pair, open this flow's own session, wait for the hub.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
- tapOn:
    id: "session-${HUBITEM_ID}"
- assertVisible:
    id: "session-view"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- runFlow:
    file: _hub-fan.yaml
    env:
      ITEM: "commands"
- tapOn:
    id: "hub-item-commands"
- extendedWaitUntil:
    visible:
      id: "commands-sheet"
    timeout: 5000
