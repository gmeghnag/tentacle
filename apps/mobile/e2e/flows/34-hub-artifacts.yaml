appId: so.tentacle.app
---
# 34-hub-artifacts (docs/feat/mobile-e2e-gate.md): once the session has an
# artifact (the laptop's turn `present`s one), the fan's Artifacts opens the
# gallery with that artifact in it. (Empty → dimmed is mobile-hub-commands'.)
# The shared prefix: pair, open this flow's own session, wait for the hub.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${HUBITEM_ID}"
    direction: DOWN
- tapOn:
    id: "session-${HUBITEM_ID}"
- assertVisible:
    id: "session-view"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- runScript:
    file: "34-hub-laptop.js"
    env:
      PROMPT: 'CALL present {"title":"Hub notes","content":"# Hub notes","kind":"markdown","id":"hubnotes"}'
- extendedWaitUntil:
    visible:
      id: "artifact-card-hubnotes"
    timeout: 30000
- runFlow:
    file: _hub-fan.yaml
    env:
      ITEM: "artifacts"
- tapOn:
    id: "hub-item-artifacts"
- extendedWaitUntil:
    visible:
      id: "artifact-gallery"
    timeout: 10000
# The row's accessible text is its whole label (`Hub notes, Markdown · 11 B`),
# so it is asserted by its id (docs/fix/mobile-e2e-reds.md).
- assertVisible:
    id: "artifact-gallery-row-hubnotes"
