appId: so.tentacle.app
---
# 34-hub-new (docs/feat/mobile-e2e-gate.md): More → New session opens a NEW,
# empty session (the drawer's `drawer-new` path, flow 26) — not the one the hub
# was on, which has a finished turn in it.
# The shared prefix: pair, open this flow's own session, wait for the hub.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${HUBITEM_ID}"
    direction: DOWN
- tapOn:
    id: "session-${HUBITEM_ID}"
- assertVisible:
    id: "session-view"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- tapOn:
    id: "composer-input"
- inputText: "hello from the hub"
- hideKeyboard
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    visible:
      id: "turn-idle"
    timeout: 20000
- assertNotVisible:
    id: "transcript-empty"
- runFlow:
    file: _hub-more.yaml
    env:
      ITEM: "new"
- tapOn:
    id: "hub-menu-new"
- extendedWaitUntil:
    visible:
      id: "transcript-empty"
    timeout: 10000
- assertVisible:
    id: "session-view"
