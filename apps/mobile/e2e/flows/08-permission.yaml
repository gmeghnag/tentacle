appId: so.tentacle.app
---
# 08 (docs/feat/mobile-session-view.md 12c): an `ask` tool suspends the turn on a
# permission request, which reaches the PHONE's sheet (the seeder and the laptop
# hold theirs, so only the phone can answer). Approving runs the tool exactly
# once, and the daemon's own file proves it.
#
# `EDIT a.txt` makes the mock model emit a real streamed tool call (`fs_write`),
# so this is the whole path: tool_call → permission_request → sheet → answer →
# the tool runs → a diff on the row.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${ASK1_ID}"
    direction: DOWN
- tapOn:
    id: "session-${ASK1_ID}"
- assertVisible:
    id: "session-view"
- tapOn:
    id: "composer-input"
- inputText: "EDIT a.txt"
# The keyboard covers the composer's button: dismiss it, so the tap lands
# on the button and not on a key (found by the first iOS 26 run).
- hideKeyboard
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    visible:
      id: "perm-sheet"
    timeout: 20000
# What the daemon offered, drawn by the sheet: the three options and the reply one
# (this daemon takes a reply with a refusal). A native `formSheet` opens at the
# MIDDLE detent (0.5) since docs/feat/mobile-native-sheets.md S5, so the items low
# in it are scrolled to, never assumed on screen.
- assertVisible:
    id: "perm-allow_once"
- assertVisible:
    id: "perm-allow_always"
- assertVisible:
    id: "perm-reject_once"
# No note before any attempt: at M its place (under the options) is on screen, so
# the note asserted below is the swipe's, not something always drawn.
- assertNotVisible:
    id: "perm-hold"
# D5: while the ask is unanswered the sheet cannot be swiped away — `gestureEnabled`
# is false on the route — so a drag past the bottom edge is a BLOCKED attempt (RNS's
# `presentationControllerShouldDismiss` refuses it and `gestureCancel` fires): the
# hold note appears under the options and the ask is still unanswered. This is the
# one property a unit test cannot check (a native gesture), so it is driven here.
# Two hard drags, each from the sheet's top edge (the grabber at M ≈ 54 %, then at
# S ≈ 74 %) past the bottom of the screen: the first lands the sheet at S (a drag
# still moves between detents, Step 0 F3), the second is the attempt at S.
- swipe:
    start: "50%, 54%"
    end: "50%, 99%"
    duration: 400
- waitForAnimationToEnd
- swipe:
    start: "50%, 74%"
    end: "50%, 99%"
    duration: 300
- waitForAnimationToEnd
# Still up, still unanswered: the first option is on screen even at S.
- assertVisible:
    id: "perm-allow_once"
# At S the note is below the sheet's fold, and Maestro's scroll starts at the
# screen's centre — the backdrop at S — so the sheet is dragged back to L first
# (the person's way to it). At L the whole ask fits.
- runFlow: _sheet-expand.yaml
- scrollUntilVisible:
    element:
      id: "perm-hold"
    direction: DOWN
- assertVisible:
    id: "perm-allow_once"
- scrollUntilVisible:
    element:
      id: "perm-reply"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "perm-later"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "perm-allow_once"
    direction: UP
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "08-approval"
- tapOn:
    id: "perm-allow_once"
- extendedWaitUntil:
    visible:
      id: "turn-idle"
    timeout: 20000
# The row's status id is `<callId>-ok`, so the flow first reads the id the mock
# actually minted: no guessing at the daemon's call id.
- runScript:
    file: "08-call-id.js"
- assertVisible:
    id: "tool-${output.callId}-ok"
# The diff lives in the step's open body (docs/feat/mobile-tool-rows.md, Owner
# Q7): one line per step, `+n −m` on it, the diff on tap.
- tapOn:
    id: "tool-${output.callId}-ok"
- assertVisible:
    id: "diff-${output.callId}"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "08-diff"
- runScript:
    file: "08-file.js"
