appId: so.tentacle.app
---
# 08 (docs/feat/mobile-session-view.md 12c): an `ask` tool suspends the turn on a
# permission request, which reaches the PHONE's sheet (the seeder and the laptop
# hold theirs, so only the phone can answer). Approving runs the tool exactly
# once, and the daemon's own file proves it.
#
# `EDIT a.txt` makes the mock model emit a real streamed tool call (`fs_write`),
# so this is the whole path: tool_call → permission_request → sheet → answer →
# the tool runs → a diff on the row.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${ASK1_ID}"
    direction: DOWN
- tapOn:
    id: "session-${ASK1_ID}"
- assertVisible:
    id: "session-view"
- tapOn:
    id: "composer-input"
- inputText: "EDIT a.txt"
# The keyboard covers the composer's button: dismiss it, so the tap lands
# on the button and not on a key (found by the first iOS 26 run).
- hideKeyboard
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    visible:
      id: "perm-sheet"
    timeout: 20000
# What the card offers (docs/fix/mobile-ask-surfaces.md D4): Deny and Allow once,
# outside any scroll, so they are on screen at any detent. The rare options
# (Always allow, reply) sit behind the `…` menu, never beside them.
- assertVisible:
    id: "perm-allow_once"
- assertVisible:
    id: "perm-reject_once"
- assertNotVisible:
    id: "perm-allow_always"
- tapOn:
    id: "perm-menu"
- assertVisible:
    id: "perm-allow_always"
- assertVisible:
    id: "perm-reply"
- tapOn:
    id: "perm-menu"
# The sheet NEVER blocks: a swipe down PARKS the ask (nothing is answered, nothing
# is withdrawn) and a banner under the header says it is still waiting. Two hard
# drags from the sheet's top edge (the grabber at M ≈ 54 %, then at S ≈ 74 %)
# past the bottom of the screen; a native gesture is the one thing a unit test
# cannot prove, so it is driven here.
- swipe:
    start: "50%, 54%"
    end: "50%, 99%"
    duration: 400
- waitForAnimationToEnd
- swipe:
    start: "50%, 74%"
    end: "50%, 99%"
    duration: 300
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "ask-banner"
    timeout: 10000
# Parked, not answered: the card's buttons are gone with the sheet.
- assertNotVisible:
    id: "perm-allow_once"
# The banner brings the SAME ask back (a tap is the intent to answer it).
- tapOn:
    id: "ask-banner"
- extendedWaitUntil:
    visible:
      id: "perm-allow_once"
    timeout: 10000
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "08-approval"
- tapOn:
    id: "perm-allow_once"
- extendedWaitUntil:
    visible:
      id: "turn-idle"
    timeout: 20000
# The row's status id is `<callId>-ok`, so the flow first reads the id the mock
# actually minted: no guessing at the daemon's call id.
- runScript:
    file: "08-call-id.js"
- assertVisible:
    id: "tool-${output.callId}-ok"
# The diff lives in the step's open body (docs/feat/mobile-tool-rows.md, Owner
# Q7): one line per step, `+n −m` on it, the diff on tap.
- tapOn:
    id: "tool-${output.callId}-ok"
- assertVisible:
    id: "diff-${output.callId}"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "08-diff"
- runScript:
    file: "08-file.js"
