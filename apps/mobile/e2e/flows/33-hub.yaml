appId: so.tentacle.app
---
# 33 (docs/feat/mobile-hub.md H3): the floating button is the hub.
# Settings → Activity button → Floating; in a session the hub shows at zero
# activity (its glyph, no badge).
#
# Driven: a TAP opens the fan (the items stay — mobile-hub-tap); a long-press
# opens the same fan; a tap on one commits it (Attach → the attachment chooser), a tap
# elsewhere closes it; a HOLD turn puts Stop first, and Stop stops the turn; a
# tapped Activity says "Nothing running" when it is empty; Header mode has no hub.
# Light/dark shots of the open fan.
#
# Opacity (docs/feat/mobile-hub-opacity.md): with Floating picked, a new
# "Button opacity" band appears. A fresh install is ALREADY Floating at 80 %
# (docs/feat/mobile-hub-defaults.md): the band reads 80 % before any drag, the
# slider has five step marks, and a drag to its left end reads 20 %; the
# session's shots show the faint body with the arc still solid (the arc's own
# solidity is the point: it is OUTSIDE the dimmed layer).
#
# Not driven here (stated, not hidden): press-slide-release — Maestro's `swipe`
# moves at once (a drag, never a hold), so the machine's path is pinned by
# `hub-gesture.test.ts` + `hub-session.test.ts` (the driver), and the responder's
# hold over the transcript by the H3 spike (Execution). The back-swipe after a
# close (M2) — Maestro has no iOS edge gesture (flows 05/26/28 say the same);
# VoiceOver / Reduce Motion / Reduce Transparency — not reliably togglable.
- runFlow: _pair.yaml
- extendedWaitUntil:
    visible:
      id: "computers-list"
    timeout: 30000
- tapOn:
    id: "open-settings"
- tapOn:
    id: "activity-button-floating"
# Hidden in Header mode (Owner Q1), shown with Floating. Maestro's text match is
# a FULL regex, so the label is given in full. The band sits below the fold, so
# scroll until its preview (the band's last element) is on screen.
- scrollUntilVisible:
    element:
      id: "hub-opacity-preview"
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: "hub-opacity-slider"
    timeout: 5000
# The fresh-install default (mobile-hub-defaults): Floating at 80 %, stepped.
- assertVisible:
    id: "hub-opacity-value"
    text: "80%"
- assertVisible:
    id: "hub-opacity-detent-20"
- assertVisible:
    id: "hub-opacity-detent-100"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "33-hub-opacity-band-80"
# Drag the thumb to the track's left end: the floor, 20 %.
- swipe:
    from:
      id: "hub-opacity-slider"
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: "hub-opacity-value"
      text: "20%"
    timeout: 5000
- assertVisible:
    id: "hub-opacity-preview"
# Light/dark of the band at 20 % (`_shot` flips the appearance and back).
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "33-hub-opacity-band"
# Scrolled down to the band (above): bring the back button back on screen.
- scrollUntilVisible:
    element:
      id: "settings-back"
    direction: UP
- tapOn:
    id: "settings-back"
- tapOn:
    id: "computer-${output.computerId}"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${HUB_ID}"
    direction: DOWN
- tapOn:
    id: "session-${HUB_ID}"
- assertVisible:
    id: "session-view"
# Zero activity: the hub is up anyway, with its glyph.
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
# The hub is ONE accessible element (VoiceOver reads one button), so XCUITest
# sees none of its children (`hub-glyph`, `hub-badge-count`): what it shows is
# asserted through its label, which says the same (`hubA11yLabel`,
# docs/fix/mobile-e2e-reds.md).
- assertVisible:
    id: "floating-activity"
    text: "Tentacle hub"
# At 20 % (set above): the body is faint but the button is still there, and the
# arc — when a turn runs — is at full opacity (it is outside the dimmed layer).
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "33-hub-opacity-20"
# Long-press → the sticky fan; Workflows holds the first slot (Attach's, owner
# 2026-11-24: the composer `+` is the one chooser, docs/fix/workflows-ux.md D6),
# and the fan closes on the scrim without running anything.
- longPressOn:
    id: "floating-activity"
- extendedWaitUntil:
    visible:
      id: "hub-item-workflows"
    timeout: 5000
- assertVisible:
    id: "hub-item-activity"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "33-hub-fan"
- tapOn:
    id: "hub-scrim"
- assertNotVisible:
    id: "hub-item-workflows"
- assertNotVisible:
    text: "Add an attachment"
# Long-press → tap outside the items → the fan is gone, nothing ran.
- longPressOn:
    id: "floating-activity"
- extendedWaitUntil:
    visible:
      id: "hub-scrim"
    timeout: 5000
- tapOn:
    point: "30%,40%"
- assertNotVisible:
    id: "hub-scrim"
- assertNotVisible:
    text: "Add an attachment"
# A long turn: Stop is in the fan; tapping it stops the turn.
- tapOn:
    id: "composer-input"
- inputText: "HOLD hub"
- hideKeyboard
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    visible:
      id: "turn-running"
    timeout: 20000
# 20 % and a turn running, at rest: the faint body with the arc still solid — the
# one thing this feature must not lose (the arc is outside the dimmed layer).
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "33-hub-opacity-20-running"
- longPressOn:
    id: "floating-activity"
- extendedWaitUntil:
    visible:
      id: "hub-item-stop"
    timeout: 5000
- assertVisible:
    id: "hub-item-steer"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "33-hub-fan-running"
- tapOn:
    id: "hub-item-stop"
- extendedWaitUntil:
    visible:
      id: "turn-idle"
    timeout: 20000
# A TAP opens the fan (mobile-hub-tap), and it is the only path to Activity now.
# Nothing runs here (the turn above was stopped, no sub-agent, job, schedule or
# finished report), so Activity is DIMMED: a tap on it opens no sheet, it says
# "Nothing running" inline. The sheet's own path (something running) is 27's.
- tapOn:
    id: "floating-activity"
- extendedWaitUntil:
    visible:
      id: "hub-item-activity"
    timeout: 5000
- tapOn:
    id: "hub-item-activity"
- extendedWaitUntil:
    visible:
      id: "hub-notice"
    timeout: 5000
- assertNotVisible:
    id: "activity-sheet"
# Back to 80 % (the default), so the last shots show the shipped look.
- tapOn:
    id: "session-drawer"
- tapOn:
    id: "drawer-settings"
# Below the fold again (Settings opens at its top): scroll to the band, and back
# up to the back button after (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "hub-opacity-preview"
    direction: DOWN
# A TAP on the 80 % mark (the fresh-install default, mobile-hub-defaults), not a
# swipe RIGHT: on iOS 26 a rightward swipe that starts on the track was taken as
# the stack's content back-swipe and popped Settings. The 100 % mark sits at the
# track's very end (its centre is past the edge, so a tap there misses the track);
# the 80 % mark is inside, and `pointerEvents="none"` lets the touch land on the
# track, whose grant sets the value there (docs/fix/mobile-e2e-reds.md).
- tapOn:
    id: "hub-opacity-detent-80"
- extendedWaitUntil:
    visible:
      id: "hub-opacity-value"
      text: "80%"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "settings-back"
    direction: UP
- tapOn:
    id: "settings-back"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 10000
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "33-hub-opacity-80-again"
# Header mode: no hub — and no opacity band (Owner Q1: hidden, not zeroed).
- tapOn:
    id: "session-drawer"
- tapOn:
    id: "drawer-settings"
- tapOn:
    id: "activity-button-header"
- assertNotVisible:
    id: "hub-opacity-slider"
- tapOn:
    id: "settings-back"
- assertNotVisible:
    id: "floating-activity"
