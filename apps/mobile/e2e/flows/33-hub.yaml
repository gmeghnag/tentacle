appId: so.tentacle.app
---
# 33 (docs/feat/mobile-hub.md H3): the floating button is the hub.
# Settings → Activity button → Floating; in a session the hub shows at zero
# activity (its glyph, no badge).
#
# Driven: a TAP opens the fan (the items stay — mobile-hub-tap); a long-press
# opens the same fan; a tap on one commits it (Attach → the attachment chooser), a tap
# elsewhere closes it; a HOLD turn puts Stop first, and Stop stops the turn; a
# tapped Activity says "Nothing running" when it is empty; Header mode has no hub.
# Light/dark shots of the open fan.
#
# Opacity (docs/feat/mobile-hub-opacity.md): with Floating picked, a new
# "Button opacity" band appears; a drag to its left end reads 30 %, and the
# session's shots show the faint body with the arc still solid (the arc's own
# solidity is the point: it is OUTSIDE the dimmed layer).
#
# Not driven here (stated, not hidden): press-slide-release — Maestro's `swipe`
# moves at once (a drag, never a hold), so the machine's path is pinned by
# `hub-gesture.test.ts` + `hub-session.test.ts` (the driver), and the responder's
# hold over the transcript by the H3 spike (Execution). The back-swipe after a
# close (M2) — Maestro has no iOS edge gesture (flows 05/26/28 say the same);
# VoiceOver / Reduce Motion / Reduce Transparency — not reliably togglable.
- runFlow: _pair.yaml
- extendedWaitUntil:
    visible:
      id: "computers-list"
    timeout: 30000
- tapOn:
    id: "open-settings"
- tapOn:
    id: "activity-button-floating"
# Hidden in Header mode (Owner Q1), shown with Floating. Maestro's text match is
# a FULL regex, so the label is given in full.
- extendedWaitUntil:
    visible:
      id: "hub-opacity-slider"
    timeout: 5000
- assertVisible:
    id: "hub-opacity-value"
    text: "100%"
# Drag the thumb to the track's left end: the floor, 30 %.
- swipe:
    from:
      id: "hub-opacity-slider"
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: "hub-opacity-value"
      text: "30%"
    timeout: 5000
- assertVisible:
    id: "hub-opacity-preview"
# Light/dark of the band at 30 % (`_shot` flips the appearance and back).
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "33-hub-opacity-band"
- tapOn:
    id: "settings-back"
- tapOn:
    id: "computer-${output.computerId}"
- tapOn:
    id: "session-${HUB_ID}"
- assertVisible:
    id: "session-view"
# Zero activity: the hub is up anyway, with its glyph.
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- assertVisible:
    id: "hub-glyph"
# At 30 % (set above): the body is faint but the button is still there, and the
# arc — when a turn runs — is at full opacity (it is outside the dimmed layer).
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "33-hub-opacity-30"
# Long-press → the sticky fan; Attach is in it; a tap commits → the chooser.
- longPressOn:
    id: "floating-activity"
- extendedWaitUntil:
    visible:
      id: "hub-item-attach"
    timeout: 5000
- assertVisible:
    id: "hub-item-activity"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "33-hub-fan"
- tapOn:
    id: "hub-item-attach"
- extendedWaitUntil:
    visible:
      text: "Add an attachment"
    timeout: 5000
- tapOn:
    text: "Cancel"
- assertNotVisible:
    id: "hub-item-attach"
# Long-press → tap outside the items → the fan is gone, nothing ran.
- longPressOn:
    id: "floating-activity"
- extendedWaitUntil:
    visible:
      id: "hub-scrim"
    timeout: 5000
- tapOn:
    point: "30%,40%"
- assertNotVisible:
    id: "hub-scrim"
- assertNotVisible:
    text: "Add an attachment"
# A long turn: Stop is in the fan; tapping it stops the turn.
- tapOn:
    id: "composer-input"
- inputText: "HOLD hub"
- hideKeyboard
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    visible:
      id: "turn-running"
    timeout: 20000
# 30 % and a turn running, at rest: the faint body with the arc still solid — the
# one thing this feature must not lose (the arc is outside the dimmed layer).
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "33-hub-opacity-30-running"
- longPressOn:
    id: "floating-activity"
- extendedWaitUntil:
    visible:
      id: "hub-item-stop"
    timeout: 5000
- assertVisible:
    id: "hub-item-steer"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "33-hub-fan-running"
- tapOn:
    id: "hub-item-stop"
- extendedWaitUntil:
    visible:
      id: "turn-idle"
    timeout: 20000
# A TAP opens the fan (mobile-hub-tap), and it is the only path to Activity now.
# Nothing runs here (the turn above was stopped, no sub-agent, job, schedule or
# finished report), so Activity is DIMMED: a tap on it opens no sheet, it says
# "Nothing running" inline. The sheet's own path (something running) is 27's.
- tapOn:
    id: "floating-activity"
- extendedWaitUntil:
    visible:
      id: "hub-item-activity"
    timeout: 5000
- tapOn:
    id: "hub-item-activity"
- extendedWaitUntil:
    visible:
      id: "hub-notice"
    timeout: 5000
- assertNotVisible:
    id: "activity-sheet-close"
# Back to 100 %: the band's right end, so the last shots show today's look.
- tapOn:
    id: "session-drawer"
- tapOn:
    id: "drawer-settings"
- swipe:
    from:
      id: "hub-opacity-slider"
    direction: RIGHT
- extendedWaitUntil:
    visible:
      id: "hub-opacity-value"
      text: "100%"
    timeout: 5000
- tapOn:
    id: "settings-back"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 10000
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "33-hub-opacity-100"
# Header mode: no hub — and no opacity band (Owner Q1: hidden, not zeroed).
- tapOn:
    id: "session-drawer"
- tapOn:
    id: "drawer-settings"
- tapOn:
    id: "activity-button-header"
- assertNotVisible:
    id: "hub-opacity-slider"
- tapOn:
    id: "settings-back"
- assertNotVisible:
    id: "floating-activity"
