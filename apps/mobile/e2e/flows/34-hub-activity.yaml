appId: so.tentacle.app
---
# 34-hub-activity (docs/feat/mobile-e2e-gate.md): with something running (the
# mock model's `AGENTS27`: two background children), the fan's Activity opens
# the Activity sheet and the running child is in it. (The EMPTY case — a notice,
# no sheet — is flow 33's.)
# The shared prefix: pair, open this flow's own session, wait for the hub.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
- tapOn:
    id: "session-${HUBITEM_ID}"
- assertVisible:
    id: "session-view"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- tapOn:
    id: "composer-input"
- inputText: "AGENTS27"
- hideKeyboard
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    visible:
      id: "hub-badge-count"
    timeout: 30000
- runFlow:
    file: _hub-fan.yaml
    env:
      ITEM: "activity"
- tapOn:
    id: "hub-item-activity"
- extendedWaitUntil:
    visible:
      id: "activity-sheet"
    timeout: 5000
- assertVisible:
    text: "long child"
