appId: so.tentacle.app
---
# 34-hub-activity (docs/feat/mobile-e2e-gate.md): with something running (the
# mock model's `AGENTS27`: two background children), the fan's Activity opens
# the Activity sheet and the running child is in it. (The EMPTY case — a notice,
# no sheet — is flow 33's.)
# The shared prefix: pair, open this flow's own session, wait for the hub.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${HUBITEM_ID}"
    direction: DOWN
- tapOn:
    id: "session-${HUBITEM_ID}"
- assertVisible:
    id: "session-view"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- tapOn:
    id: "composer-input"
- inputText: "AGENTS27"
- hideKeyboard
- tapOn:
    id: "composer-send"
# The hub is ONE accessible element (VoiceOver reads one button), so XCUITest
# sees none of its children (`hub-glyph`, `hub-badge-count`): what it shows is
# asserted through its label, which says the same (`hubA11yLabel`,
# docs/fix/mobile-e2e-reds.md).
- extendedWaitUntil:
    visible:
      id: "floating-activity"
      text: "Tentacle hub, [0-9]+ running.*"
    timeout: 30000
- runFlow:
    file: _hub-fan.yaml
    env:
      ITEM: "activity"
- tapOn:
    id: "hub-item-activity"
- extendedWaitUntil:
    visible:
      id: "activity-sheet"
    timeout: 5000
# A row's accessible text is its whole label: matched by its prefix.
- assertVisible:
    text: "long child,.*"
