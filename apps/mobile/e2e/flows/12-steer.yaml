appId: so.tentacle.app
---
# 12 (docs/feat/mobile-compose.md 13d): a STEER. A turn runs (a `HOLD` from the
# laptop), the phone types into the field and the one button QUEUES it — the row
# appears at once as mine, and the hook proves the daemon injected it into that
# turn.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${STEER_ID}"
    direction: DOWN
- tapOn:
    id: "session-${STEER_ID}"
- assertVisible:
    id: "session-view"
- assertVisible:
    id: "turn-idle"
- runScript:
    file: "12-laptop-hold.js"
- extendedWaitUntil:
    visible:
      id: "turn-running"
    timeout: 20000
- tapOn:
    id: "composer-input"
- inputText: "STEER twelve"
- hideKeyboard
# A turn runs with text in the field: the button QUEUES (D1), it does not send.
- tapOn:
    id: "composer-send"
# The queued message is a PENDING BUBBLE in the transcript's footer now
# (docs/feat/mobile-queued-compose.md D1), not a card above the field. Its own id
# carries the daemon's key, which a flow cannot know: `pending-bubbles` is the
# footer, and the bubble inside it is `pending-<id>-mine`.
- extendedWaitUntil:
    visible:
      id: "pending-bubbles"
    timeout: 20000
- assertVisible:
    id: "pending-.*-mine"
# The tap QUEUED it: the field is cleared in the same step (D1's synchronous
# clear, so a double tap cannot queue twice) and the bubble is what carries the text.
- assertNotVisible:
    id: "composer-filled"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "12-queue"
# The steer is in; end the laptop's GATED turn so its round boundary injects it.
- runScript:
    file: "12-release.js"
# No id on the row itself (its id is a daemon-side key): the LAST step is the
# daemon's own truth, which is what this flow actually asserts.
- runScript:
    file: "12-steer.js"
