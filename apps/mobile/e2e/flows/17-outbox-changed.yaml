appId: so.tentacle.app
---
# 17 (docs/feat/mobile-compose.md 13d): an offline item whose conversation CHANGED under
# it (the laptop ran a turn meanwhile). `decide` must not auto-send: the person gets
# the decision sheet, and its Send reuses the ORIGINAL key, so the text goes out once.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${CHANGED_ID}"
    direction: DOWN
- tapOn:
    id: "session-${CHANGED_ID}"
- assertVisible:
    id: "session-view"
- runScript:
    file: "17-stop-serve.js"
- extendedWaitUntil:
    visible:
      id: "banner-reconnecting"
    timeout: 30000
- tapOn:
    id: "composer-input"
- inputText: "CHANGED seventeen"
- hideKeyboard
- tapOn:
    id: "composer-send-later"
- extendedWaitUntil:
    visible:
      id: "waiting-network"
    timeout: 20000
# The laptop composes into the SAME session while the phone is offline (the turn is
# recorded daemon-side and replayed on the phone's re-attach), so the basis changes.
# The laptop moves FIRST, while the phone is still offline: a side `serve` (same
# store, a port the phone does not know) runs one turn and stops. Done after the
# restart, it raced the phone's redial: the outbox now runs at `up`, and a phone
# back first sent the item as unchanged (docs/fix/mobile-e2e-reds.md).
- runScript:
    file: "17-laptop-offline.js"
- runScript:
    file: "17-start-serve.js"
# The outbox's `decide` says "changed": the row waits as "Needs your answer"
# (`outbox-row-<id>-needs-decision`), and a tap on it opens the decision sheet —
# the sheet never jumps up by itself (docs/fix/mobile-e2e-reds.md).
- extendedWaitUntil:
    visible:
      id: "outbox-row-.*-needs-decision"
    timeout: 40000
- tapOn:
    id: "outbox-row-.*-needs-decision"
- extendedWaitUntil:
    visible:
      id: "outbox-decision"
    timeout: 10000
- tapOn:
    id: "outbox-send"
- extendedWaitUntil:
    notVisible:
      id: "outbox-decision"
    timeout: 20000
- runScript:
    file: "17-once.js"
