appId: so.tentacle.app
---
# 01 (docs/feat/mobile-app-shell.md; re-pointed by docs/feat/mobile-pairing-screen.md
# 11b.1): the flow PAIRS this simulator with the harness's `serve` (the `_pair`
# subflow — the app has no build-time computer any more) and lands on `Computers`
# with the new computer's project row.
# Assertions are by testID only: React Native under the new architecture exposes
# no text/label to XCUITest (established empirically — a plain `Text` reads as
# an empty string), so asserting on visible text would be permanently red.
- runFlow: _pair.yaml
- assertVisible:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "computers-list"
