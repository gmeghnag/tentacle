appId: so.tentacle.app
---
# 34-hub-tools (docs/feat/mobile-e2e-gate.md): the fan's Tools opens the Tools
# sheet, listing the harness's MCP server `demo` (run.ts `harnessConfigText`).
# The shared prefix: pair, open this flow's own session, wait for the hub.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${HUBITEM_ID}"
    direction: DOWN
- tapOn:
    id: "session-${HUBITEM_ID}"
- assertVisible:
    id: "session-view"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- runFlow:
    file: _hub-fan.yaml
    env:
      ITEM: "tools"
- tapOn:
    id: "hub-item-tools"
- extendedWaitUntil:
    visible:
      id: "tools-sheet"
    timeout: 10000
# The server's band is one accessible element (`demo, Show demo to the model…`),
# so it is reached by its id (docs/fix/mobile-e2e-reds.md). Since docs/feat/
# mobile-native-sheets.md S4 the sheet is a native `formSheet` opening at the
# MIDDLE detent, so the first band may sit below the fold: the scroll IS the
# assertion (and the sheet's ONE scroller is what reaches it, F8).
- scrollUntilVisible:
    element:
      id: "tools-mcp:demo"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "tools-mcp:demo"
