appId: so.tentacle.app
---
# 34-hub-tools (docs/feat/mobile-e2e-gate.md): the fan's Tools opens the Tools
# sheet, listing the harness's MCP server `demo` (run.ts `harnessConfigText`).
# The shared prefix: pair, open this flow's own session, wait for the hub.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
- tapOn:
    id: "session-${HUBITEM_ID}"
- assertVisible:
    id: "session-view"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- runFlow:
    file: _hub-fan.yaml
    env:
      ITEM: "tools"
- tapOn:
    id: "hub-item-tools"
- extendedWaitUntil:
    visible:
      id: "tools-sheet"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "demo"
    timeout: 15000
