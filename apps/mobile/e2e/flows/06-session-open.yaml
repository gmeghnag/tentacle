appId: so.tentacle.app
---
# 06 (docs/feat/mobile-session-view.md 12c): tapping a session OPENS it — the
# screen attaches (`session/open`, never a create), the daemon's history arrives
# as rows, and going back DETACHES without ending the session.
#
# Assertions are by testID only: RN's new architecture exposes no text to
# XCUITest (plan P9). The daemon-side truth is a hook (`session-state`), which is
# what makes "back detaches, never closes" a real assertion: `attached` drops to
# the laptop's count and `archived` stays false.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${ALPHA_ID}"
    direction: DOWN
- tapOn:
    id: "session-${ALPHA_ID}"
- assertVisible:
    id: "session-view"
# Alpha's seeded turn is two rows (the prompt and the mock's answer): a history
# row proves the attach fetched the daemon's transcript, not just the frame.
- assertVisible:
    id: "row-r1"
- assertVisible:
    id: "row-r2"
- assertVisible:
    id: "turn-idle"
# docs/feat/mobile-copy-text.md (item 8): a long-press on a message copies it
# whole and the pill `✓ Copied · Select text` shows above the composer. Ids only
# (RN's new architecture exposes no text to XCUITest, P9 in
# docs/feat/mobile-session-view.md:170); `copy-flash-select` is what pins the
# state to "Copied" — "No text to copy" and "Couldn't copy" offer no action.
# `row-r2` is the seeded answer, `r2` per the fold's `r<seq>` keys
# (`transcript.ts:197`), so its wrapper is `row-r2-copy`.
# The pill's 2.5 s window starts at the RELEASE, not at the copy (D3): Maestro
# holds a long press for 3 s, so a window counted from the copy would be spent
# under the finger — the first gate run asserted exactly that and found nothing.
- assertVisible:
    id: "row-r2-copy"
- longPressOn:
    id: "row-r2-copy"
- extendedWaitUntil:
    visible:
      id: "copy-flash"
    timeout: 5000
- assertVisible:
    id: "copy-flash-select"
# Leaving: the session screen has no back button since docs/feat/mobile-chrome.md
# (its header is the drawer), and Maestro has no iOS edge swipe — so the flow
# leaves the way a person does now, by switching to another session in the
# drawer: same computer → `replace`, which unmounts ALPHA's screen (its `leave()`).
# (Found by the first gate run, docs/feat/mobile-e2e-gate.md: `BackButton` gone.)
- tapOn:
    id: "session-drawer"
- tapOn:
    id: "drawer-session-${CHARLIE_ID}"
- waitForAnimationToEnd
- assertVisible:
    id: "session-view"
- assertNotVisible:
    id: "drawer"
# The laptop is still attached (the seeder keeps it), so the phone leaving must
# take `attached` back to 1 — a `session/close` instead would set archived: true.
- runScript:
    file: "06-session-left.js"
