appId: so.tentacle.app
---
# 24 (docs/feat/mobile-ui-polish.md Slice 6): the screenshot walk. Every screen
# the restyle touched, in the order a person meets them — Pair (empty, keyboard
# up with the pasted line, the review sheet, the compare code), Computers,
# Settings, Sessions, the Conversation with the mock model's `SHOWCASE` answer
# (inline code chip + run, a code block with quotes/<>/& — owner B7 —, a table,
# a list), and the header's "…" menu. Each screen is shot in light AND dark by
# `_shot` (the `appearance` hook flips the simulator), so one run is the set.
# It asserts each screen's own ids, so a screenshot of the wrong screen fails.
#
# The pairing is `_pair`'s steps inlined, with a shot at each stage: the Pair
# screen is the first one a person sees, and the paste field above the keyboard
# is itself a fix of this slice (the walk failed at `pair-review` while the
# field sat under the keyboard).
- runScript:
    file: "appearance.js"
    env:
      NAME: "light"
- runScript:
    file: "pair-start.js"
- launchApp:
    clearState: true
- clearKeychain
- runFlow: _unlock.yaml
- extendedWaitUntil:
    visible:
      id: "pair-paste-input"
    timeout: 30000
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "24-pair"
- tapOn:
    id: "pair-paste-input"
- inputText: ${output.payload}
# The fix under test: with the keyboard up and the line pasted (it wraps to
# several lines), the field AND Continue are on screen, above the keyboard.
- assertVisible:
    id: "pair-paste-submit"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "24-pair-keyboard"
- tapOn:
    id: "pair-paste-submit"
- assertVisible:
    id: "pair-review"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "24-pair-review"
- tapOn:
    id: "pair-confirm"
- runScript:
    file: "pair-confirm.js"
- assertVisible:
    id: "pair-sas-${output.sas}"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "24-pair-compare"
- runScript:
    file: "pair-answer.js"
- assertVisible:
    id: "computers-list"
- assertVisible:
    id: "computer-${output.computerId}"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "24-computers"
- tapOn:
    id: "open-settings"
- assertVisible:
    id: "lock-delay-immediately"
# Below the fold since the hub's opacity band grew Settings (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "export-logs"
    direction: DOWN
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "24-settings"
- scrollUntilVisible:
    element:
      id: "settings-back"
    direction: UP
- tapOn:
    id: "settings-back"
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-search"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "24-sessions"
# The search with no hit: its own designed state (visual review V5).
- tapOn:
    id: "sessions-search"
- inputText: "nothing like this"
- assertVisible:
    id: "sessions-no-match"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "24-sessions-no-match"
- eraseText: 30
- hideKeyboard
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${SHOTS_ID}"
    direction: DOWN
- tapOn:
    id: "session-${SHOTS_ID}"
- assertVisible:
    id: "session-view"
- tapOn:
    id: "composer-input"
- inputText: "SHOWCASE"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "code-2-copy"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "turn-idle"
    timeout: 20000
- hideKeyboard
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "24-conversation"
- tapOn:
    id: "session-menu"
- assertVisible:
    id: "session-menu-copy-last"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "24-session-menu"
- tapOn:
    id: "session-menu-cancel"
- assertNotVisible:
    id: "session-menu-copy-last"
# mobile-chrome S6: the sessions drawer over the conversation (both themes).
- tapOn:
    id: "session-drawer"
- assertVisible:
    id: "drawer-current-${SHOTS_ID}"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "24-drawer"
# The scrim by POINT: it sits under the drawer's accessibility-hidden content
# (VoiceOver closes with Escape), so XCUITest cannot find `drawer-scrim` by id
# (docs/fix/mobile-e2e-reds.md). 90 % x is right of the drawer, on the scrim.
- tapOn:
    point: "90%,50%"
- assertNotVisible:
    id: "drawer"
# Leave the simulator light for whatever runs next.
- runScript:
    file: "appearance.js"
    env:
      NAME: "light"
