appId: so.tentacle.app
---
# 05 (docs/feat/mobile-app-shell.md): the daemon goes away → the list shows the
# honest "Can't connect" notice; it comes back → a refresh lists the sessions
# again (serve persisted them).
#
# The recovery step asserts something that CANNOT pass in the broken state
# (review round 1 finding 2): a seeded row is back AND the stale notice is gone.
# `sessions-list` alone was the ScrollView, on screen in every state, so the old
# final assertion was vacuous — it is why a list that never cleared `stale`
# passed this flow.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
- runScript:
    file: "05-stop-serve.js"
- swipe:
    start: "50%, 30%"
    end: "50%, 80%"
- assertVisible:
    id: "sessions-stale"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "05-sessions-stale"
# mobile-chrome F2: the drawer over a session of the down computer says the list
# could not be read, with Retry — never an empty "no sessions".
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${ALPHA_ID}"
    direction: DOWN
- tapOn:
    id: "session-${ALPHA_ID}"
- tapOn:
    id: "session-drawer"
- extendedWaitUntil:
    visible:
      id: "drawer-retry"
    timeout: 20000
- assertNotVisible:
    id: "drawer-empty"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "05-drawer-offline"
# The magnifier resets the stack to Computers → Sessions (the session screen has
# no back button any more; Maestro has no iOS edge swipe).
- tapOn:
    id: "drawer-search"
- hideKeyboard
# The computer, offline, on Computers (visual review V5) — then back in.
- tapOn:
    id: "sessions-back"
- assertVisible:
    id: "computers-list"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "05-computers-offline"
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
- runScript:
    file: "05-start-serve.js"
- swipe:
    start: "50%, 30%"
    end: "50%, 80%"
# A row proves the list was actually re-read from the restarted daemon…
- assertVisible:
    id: "session-${ALPHA_ID}"
# …and no stale notice proves the successful page cleared it (finding 1).
- assertNotVisible:
    id: "sessions-stale"
