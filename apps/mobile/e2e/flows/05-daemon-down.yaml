appId: so.tentacle.app
---
# 05 (docs/feat/mobile-app-shell.md): the daemon goes away → the list shows the
# honest "Can't connect" notice; it comes back → a refresh lists the sessions
# again (serve persisted them).
#
# The recovery step asserts something that CANNOT pass in the broken state
# (review round 1 finding 2): a seeded row is back AND the stale notice is gone.
# `sessions-list` alone was the ScrollView, on screen in every state, so the old
# final assertion was vacuous — it is why a list that never cleared `stale`
# passed this flow.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
- runScript:
    file: "05-stop-serve.js"
- swipe:
    start: "50%, 30%"
    end: "50%, 80%"
- assertVisible:
    id: "sessions-stale"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "05-sessions-stale"
# mobile-chrome F2: the drawer over a session of the down computer says the list
# could not be read, with Retry — never an empty "no sessions".
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${ALPHA_ID}"
    direction: DOWN
- tapOn:
    id: "session-${ALPHA_ID}"
- tapOn:
    id: "session-drawer"
- extendedWaitUntil:
    visible:
      id: "drawer-retry"
    timeout: 20000
- assertNotVisible:
    id: "drawer-empty"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "05-drawer-offline"
# The magnifier resets the stack to Computers → Sessions (the session screen has
# no back button any more; Maestro has no iOS edge swipe).
- tapOn:
    id: "drawer-search"
- hideKeyboard
# The Sessions screen the magnifier reset to, still offline: the stale notice is
# drawn here too. This is where the recovery is proved (finding 1): the notice is
# ON before the daemon comes back, so its absence after the refresh is earned.
- swipe:
    start: "50%, 30%"
    end: "50%, 80%"
- extendedWaitUntil:
    visible:
      id: "sessions-stale"
    timeout: 20000
- runScript:
    file: "05-start-serve.js"
- swipe:
    start: "50%, 30%"
    end: "50%, 80%"
# A row proves the list was actually re-read from the restarted daemon…
- extendedWaitUntil:
    visible:
      id: "session-${ALPHA_ID}"
    timeout: 20000
# …and no stale notice proves the successful page cleared it (finding 1).
- assertNotVisible:
    id: "sessions-stale"
# The computer on Computers (visual review V5), then back in by its row. A
# STOPPED project's tap re-probes instead of opening (feat/mobile-projects-app,
# docs/feat/mobile-projects.md §6 / mockup A3; 0b65e100), so the "offline" shot
# and the tap-in can no longer share one offline moment: the offline Computers
# screen is shot by flow 37 (`37-a3-stopped`), and this tap proves a row that
# answers again opens (fix/mobile-project-first-tap: a tap on a row still marked
# stopped waits for its probe, then opens).
- tapOn:
    id: "sessions-back"
# The first tap can be spent on the search field `drawer-search` focused (its
# keyboard going down counts as "something changed"; run 1795286260264 stayed
# on Sessions): one more tap only while Computers is not up yet.
- runFlow:
    when:
      notVisible:
        id: "computers-list"
    commands:
      - tapOn:
          id: "sessions-back"
- extendedWaitUntil:
    visible:
      id: "computers-list"
    timeout: 10000
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "05-computers-back"
- tapOn:
    id: "computer-${output.computerId}"
# The container only proves the tap opened something: `sessions-list` is on
# screen in every state, so it is never the flow's last assertion (the guard in
# `apps/mobile/test/e2e-flows.test.ts`: "no flow ENDS on the container it starts
# on"). The wait stays — it is what gives the answering row time to open.
- extendedWaitUntil:
    visible:
      id: "sessions-list"
    timeout: 20000
# …and the flow ends on the daemon's OWN content: a seeded row of this project
# can only be drawn from the list the restarted `serve` served. Scrolled to first,
# since earlier flows' sessions sit above it (newest first) and in the full suite
# it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${ALPHA_ID}"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "session-${ALPHA_ID}"
