appId: so.tentacle.app
---
# `_unlock` (docs/feat/mobile-lock.md, Tests): the shipped default LOCKS AT COLD
# START (Owner Q1), so every flow that wants to see the app must get past the lock
# first. There is deliberately NO test-only branch in app code for this — the
# flows drive the real lock, which is the only way the lock is ever exercised.
#
# Step 0: `notifyutil …pearl.match` makes the pending `authenticateAsync` resolve
# success on the simulator, so no tap on the system sheet is needed.
#
# iOS 26 (visual review 1, F1): the system Face ID sheet COVERS the app, so while
# it is up Maestro sees neither `lock-screen` nor the content — asserting
# `lock-screen` visible first hangs, and asserting it NOT visible afterwards
# passes vacuously. So the subflow keys on the one POSITIVE signal of an unlocked
# app instead: `LockGate`'s wrapper reads `app-content` only once the cover is
# down (it reads `locked-content`, hidden from the accessibility tree, before).
#
# The content is NOT REACHABLE while locked (F14): `computers-list` is hidden
# whether the system sheet is up or not.
- runScript:
    file: "faceid-enroll.js"
- assertNotVisible:
    id: "computers-list"
# A match posted before the prompt is up resolves nothing (the orchestrator's
# recipe, step 3), and the prompt may come up late: post it again until the app
# is in, a bounded number of times.
- repeat:
    times: 8
    while:
      notVisible:
        id: "app-content"
    commands:
      - runScript:
          file: "faceid-match.js"
      - extendedWaitUntil:
          visible:
            id: "app-content"
          timeout: 2500
        optional: true
- assertVisible:
    id: "app-content"
- assertNotVisible:
    id: "lock-screen"
