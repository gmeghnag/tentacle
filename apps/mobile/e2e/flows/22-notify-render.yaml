appId: so.tentacle.app
---
# `22-notify-render` (docs/feat/mobile-notifications.md N8, decision 20): the phone
# RENDERS a real end-to-end encrypted push — the part of task 17 a simulator can
# prove.
#
# WHAT THIS PROVES: the app's notification wiring (categories registered at start,
# the foreground handler, Open routing) and that a push sealed by the COMPUTER's
# key arrives as a banner, on that session's thread.
#
# WHAT IT DOES **NOT** PROVE, stated so nobody reads more into a green run: the
# NSE's decrypt and its category override. The extension is a native target that
# only exists in a **device build** (`apps/mobile/targets/notification-service`,
# generated by `@bacons/apple-targets`), and building it needs the owner's Apple
# console steps (D3a: the extension's App ID + keychain sharing). Until D3a, iOS
# draws the relay's placeholder (`aps` template, task 16 P4) and this flow asserts
# THAT — the same assertion `push-placeholder` makes — so a regression in the
# wiring is still caught, and the NSE's own logic is pinned by `bun run test:swift`
# over the shared vectors (which IS in the gate).
- runFlow: _pair.yaml
- assertVisible:
    id: "computers-list"
- tapOn:
    id: "computer-${output.computerId}"
- extendedWaitUntil:
    visible:
      id: "sessions-list"
    timeout: 30000
# Maestro's `back` is Android's key (a no-op on iOS): the screen's own back button.
- tapOn:
    id: "sessions-back"
# The harness seals an ASK it chose (with a reply offered) to this phone's push
# key and hands the exact payload to `simctl push`. The sealing decision is
# `e2e-notify-steps.test.ts`'s (`bun test` opens it with the device key).
- runScript:
    file: "22-notify-seal-placeholder.js"
# THE BANNER. Without the NSE (no D3a yet) iOS draws the relay's fixed text —
# asserting it is asserting that a real, sealed APNs payload was accepted.
- extendedWaitUntil:
    visible: "Open tentacle to see what's new"
    timeout: 15000
- assertVisible: "tentacle"
# A tap opens the app (the OS's routing). The app lands where it was.
- tapOn: "Open tentacle to see what's new"
- extendedWaitUntil:
    visible:
      id: "computers-list"
    timeout: 30000
# TRUTH, not screens (plan P9: an element says what the app DREW). What was placed
# is a real sealed envelope — `tp.v/k/e/c` — produced by the harness's own
# `sealPush` from the phone's push key, so the payload the OS accepted is one the
# app's decrypt path could open (the decision is `e2e-notify-steps.test.ts`'s).
- runScript:
    file: "22-notify-assert-payload.js"
