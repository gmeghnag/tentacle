appId: so.tentacle.app
---
# 25 (docs/feat/mobile-session-info.md): the "…" menu's Session info sheet. It
# opens ALWAYS (a read, not an action on the computer), pulls four facts over the
# one client stack, and shows them: the daemon's model, the session's context,
# the computer's MCP servers (one connected with tools, one failed) and the
# skills (`/e2e-demo`).
#
# Assertions are by testID only (plan P9: RN's new architecture exposes no text),
# and the flow ENDS on daemon truth: `25-session-info.js` reads the rename the
# sheet's title tap performed through `session/list`. A screen claim alone could
# pass while nothing reached the computer.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${INFO_ID}"
    direction: DOWN
- tapOn:
    id: "session-${INFO_ID}"
- assertVisible:
    id: "session-view"
# The header already knows the daemon's model and shows its context bar (Owner
# decisions 2 and 4), before the sheet is asked for anything.
- assertVisible:
    id: "session-header-model"
- assertVisible:
    id: "session-header-context"
# The "…" menu: Session info is its FIRST action, present on a session with
# nothing to copy.
- tapOn:
    id: "session-menu"
- assertVisible:
    id: "session-menu-info"
- tapOn:
    id: "session-menu-info"
- assertVisible:
    id: "session-info-sheet"
- assertVisible:
    id: "session-info-model-Model"
- assertVisible:
    id: "session-info-model-Context"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "25-session-info-top"
# Since docs/feat/mobile-native-sheets.md S4 this is a native `formSheet` that
# opens at the MIDDLE detent: the MCP band is below its fold. Asserted, so the
# expand below is a real detent change and not a sheet that was already large.
- assertNotVisible:
    id: "session-info-mcp-demo"
# A slow drag on the ONE scroller (F8) takes the sheet to LARGE; then the MCP
# band is on screen. That is the person's way to the band, and it is the scroll.
- runFlow: _sheet-expand.yaml
- assertVisible:
    id: "session-info-sheet"
# The four sections' own facts: the working server with its tools, the failing
# one with its state word, and the user-scope skill.
- scrollUntilVisible:
    element:
      id: "session-info-mcp-demo"
    direction: DOWN
- assertVisible:
    id: "session-info-mcp-demo"
- assertVisible:
    id: "session-info-mcp-broken"
# Below the fold since the Scheduled wakes section (cron S6) grew the sheet: the
# scroll IS the visibility assertion (docs/fix/mobile-e2e-reds.md). At L the
# screen's centre is inside the sheet, so this scrolls the content.
- scrollUntilVisible:
    element:
      id: "session-info-skills-/e2e-demo"
    direction: DOWN
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "25-session-info-skills"
# docs/feat/session-capabilities.md S5 (P1): the `demo` server's trailing switch
# hides it from the model for THIS session. The daemon truth is read after each
# tap; it is turned back on, so a re-run starts with everything visible.
- scrollUntilVisible:
    element:
      id: "session-info-mcp-demo-switch"
    direction: UP
- tapOn:
    id: "session-info-mcp-demo-switch"
- waitForAnimationToEnd
- runScript:
    file: "25-session-capabilities.js"
    env:
      EXPECT: "off"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "25-session-info-switch-off"
- tapOn:
    id: "session-info-mcp-demo-switch"
- waitForAnimationToEnd
- runScript:
    file: "25-session-capabilities.js"
    env:
      EXPECT: "on"
# Owner decision 5: tapping the TITLE renames the session, through the existing
# `session/rename`. The flow types a name the daemon will store VERBATIM, then
# renames it back, so a re-run starts from the same title.
- tapOn:
    id: "session-info-close"
- tapOn:
    id: "session-title-tap"
- assertVisible:
    id: "session-rename-input"
# No tap on the field: it is auto-focused, and the card MOVES as the keyboard
# rises — a tap aimed at its old place hits the scrim and cancels the rename
# (docs/fix/e2e-26-drawer-pro.md).
- waitForAnimationToEnd
# The field opens with the CURRENT title in it (a rename edits it): clear it first,
# or the name is appended ("composeRenamed…", docs/fix/mobile-e2e-reds.md).
- eraseText: 60
- inputText: "Renamed by flow 25"
- tapOn:
    id: "session-rename-save"
- waitForAnimationToEnd
# The daemon truth: `session/list` carries the new title (the last step below).
- runScript:
    file: "25-session-info.js"
