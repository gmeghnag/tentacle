appId: so.tentacle.app
---
# 23 (docs/feat/mobile-ui-polish.md Slice 0): the composer and the keyboard.
# B1 — the composer sat under the keyboard (and in the home-indicator area):
# flow 07 had to `hideKeyboard` before tapping Send because the tap landed on a
# key. Here the keyboard stays UP and the tap must still reach `composer-send`.
# B2 — Return did nothing but insert a newline: here `pressKey: Enter` must send
# (the field empties and a turn runs). The last step is the daemon's history.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${KEYBOARD_ID}"
    direction: DOWN
- tapOn:
    id: "session-${KEYBOARD_ID}"
- assertVisible:
    id: "session-view"
- assertVisible:
    id: "turn-idle"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "23-keyboard-closed"
# docs/feat/mobile-composer-compact.md: at rest, with nothing in it, the field
# is ONE row — `+`, the hint, the mic — and the dimmed ↑ that did nothing is not
# drawn (OD1, OD2).
- assertVisible:
    id: "composer-compact"
- assertNotVisible:
    id: "composer-send"
# The tap that OPENS it is the input's own focus: the shape change must not
# remount it (the load-bearing rule — if it did, the keyboard would drop and the
# `inputText` below would go nowhere).
- tapOn:
    id: "composer-input"
- assertNotVisible:
    id: "composer-compact"
- assertVisible:
    id: "composer-send"
# Blur on an EMPTY field closes it again (OD3 is about holding something).
- hideKeyboard
- assertVisible:
    id: "composer-compact"
- tapOn:
    id: "composer-input"
- inputText: "SLOW keyboard button"
- runFlow:
    file: _shot.yaml
    env:
      SHOT: "23-keyboard-open"
# B1: NO hideKeyboard. With the composer under the keyboard this tap lands on a
# key, nothing is sent and the field keeps its text. Not `turn-running`: the
# SLOW turn (~4.5 s) can end inside Maestro's own tap on iOS 26 (5.7 s seen,
# docs/fix/mobile-e2e-reds.md); `23-history.js` proves the model was asked.
- assertVisible:
    id: "composer-filled"
- tapOn:
    id: "composer-send"
- assertNotVisible:
    id: "composer-filled"
- extendedWaitUntil:
    visible:
      id: "turn-idle"
    timeout: 20000
# B2: Return sends.
- tapOn:
    id: "composer-input"
- inputText: "SLOW keyboard return"
- assertVisible:
    id: "composer-filled"
# OD3: the keyboard is down and the field HOLDS text, so it stays open (two rows).
- hideKeyboard
- assertNotVisible:
    id: "composer-compact"
- tapOn:
    id: "composer-input"
- pressKey: Enter
- assertNotVisible:
    id: "composer-filled"
- extendedWaitUntil:
    visible:
      id: "turn-idle"
    timeout: 20000
- runScript:
    file: "23-history.js"
