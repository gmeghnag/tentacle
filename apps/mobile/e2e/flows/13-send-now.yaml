appId: so.tentacle.app
---
# 13 (docs/feat/mobile-compose.md 13d): SEND NOW. A `HOLD` turn runs, two steers are
# queued, and the second button takes them: the old turn is cancelled and the new
# turn's prompt is both texts joined. The hook proves the daemon's own history.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${SENDNOW_ID}"
    direction: DOWN
- tapOn:
    id: "session-${SENDNOW_ID}"
- assertVisible:
    id: "session-view"
- runScript:
    file: "13-laptop-hold.js"
- extendedWaitUntil:
    visible:
      id: "turn-running"
    timeout: 20000
- tapOn:
    id: "composer-input"
- inputText: "SENDNOW one"
- hideKeyboard
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    visible:
      id: "pending-bubbles"
    timeout: 20000
- tapOn:
    id: "composer-input"
- inputText: "SENDNOW two"
- hideKeyboard
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    visible:
      id: "composer-send-now"
    timeout: 20000
- tapOn:
    id: "composer-send-now"
- extendedWaitUntil:
    notVisible:
      id: "composer-send-now"
    timeout: 20000
- runScript:
    file: "13-send-now.js"
