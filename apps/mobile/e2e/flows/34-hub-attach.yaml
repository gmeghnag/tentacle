appId: so.tentacle.app
---
# 34-hub-attach (docs/feat/mobile-e2e-gate.md): the fan's Attach opens the
# attachment chooser it names, and Cancel closes it with the fan gone.
# The shared prefix: pair, open this flow's own session, wait for the hub.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${HUBITEM_ID}"
    direction: DOWN
- tapOn:
    id: "session-${HUBITEM_ID}"
- assertVisible:
    id: "session-view"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- runFlow:
    file: _hub-fan.yaml
    env:
      ITEM: "attach"
- tapOn:
    id: "hub-item-attach"
- extendedWaitUntil:
    visible:
      text: "Add an attachment"
    timeout: 5000
- assertVisible:
    text: "Photo Library"
- tapOn:
    text: "Cancel"
- assertNotVisible:
    text: "Add an attachment"
- assertNotVisible:
    id: "hub-item-attach"
