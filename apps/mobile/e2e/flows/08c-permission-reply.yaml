appId: so.tentacle.app
---
# 08c (docs/feat/mobile-session-view.md 12c): the REPLY variant of flow 08 — "No,
# let's talk about it" with words. The refusal carries the person's text to the
# MODEL (the daemon hands it over with the denial), and the row says `denied`
# (the refusal-with-words state, distinct from 08b's plain `error`) with the
# reply on it. The hook reads the mock model's own request, so "the words
# reached the model" is asserted where they would actually be seen.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${ASK3_ID}"
    direction: DOWN
- tapOn:
    id: "session-${ASK3_ID}"
- assertVisible:
    id: "session-view"
- tapOn:
    id: "composer-input"
- inputText: "EDIT talk.txt"
# The keyboard covers the composer's button: dismiss it, so the tap lands
# on the button and not on a key (found by the first iOS 26 run).
- hideKeyboard
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    visible:
      id: "perm-sheet"
    timeout: 20000
# The reply option opens the refusal field; the words go with the refusal (F7).
# A native `formSheet` opens at the MIDDLE detent (docs/feat/mobile-native-sheets.md
# S5), so the reply field and its "Send reply" pill sit below the fold: the sheet
# is dragged to LARGE first (Maestro's scroll starts at the screen's centre, which
# at M is the backdrop), then each is scrolled to before it is touched.
- runFlow: _sheet-expand.yaml
# The reply is a RARE option: it sits behind the card's `…` menu
# (docs/fix/mobile-ask-surfaces.md D4), never beside Deny / Allow once.
- tapOn:
    id: "perm-menu"
- tapOn:
    id: "perm-reply"
- scrollUntilVisible:
    element:
      id: "perm-reply-input"
    direction: DOWN
- tapOn:
    id: "perm-reply-input"
- inputText: "put it in tmp instead"
# NO `hideKeyboard` here (Fix round (simulator)): with the keyboard up the sheet
# scrolls its END — "Send reply" — into view above it (docs/fix/mobile-e2e-1121.md),
# and Maestro's keyboard dismissal is a touch on the screen, which landed on the
# sheet and sent the reply itself (gate run 1795473632080: the ask was gone and the
# row `denied` before the flow's own tap). So the send is reached with the keyboard
# UP — the property that fix exists for — and tapped by this flow, nothing else.
- scrollUntilVisible:
    element:
      id: "perm-reply-send"
    direction: DOWN
- tapOn:
    id: "perm-reply-send"
- extendedWaitUntil:
    visible:
      id: "turn-idle"
    timeout: 20000
- runScript:
    file: "08-call-id.js"
- assertVisible:
    id: "tool-${output.callId}-denied"
- runScript:
    file: "08c-reply.js"
