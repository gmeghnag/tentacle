appId: so.tentacle.app
---
# 34-hub-scheduled (docs/feat/mobile-e2e-gate.md): once the session has a
# scheduled wake (the laptop's turn calls `schedule_create`, approved), More
# offers Scheduled, and it opens Session info with the wake listed.
# The shared prefix: pair, open this flow's own session, wait for the hub.
- runFlow: _pair.yaml
- tapOn:
    id: "computer-${output.computerId}"
- assertVisible:
    id: "sessions-list"
# Scrolled to first: earlier flows' sessions sit above it (newest first),
# so in the full suite it can be below the fold (docs/fix/mobile-e2e-reds.md).
- scrollUntilVisible:
    element:
      id: "session-${HUBITEM_ID}"
    direction: DOWN
- tapOn:
    id: "session-${HUBITEM_ID}"
- assertVisible:
    id: "session-view"
- extendedWaitUntil:
    visible:
      id: "floating-activity"
    timeout: 30000
- runScript:
    file: "34-hub-laptop.js"
    env:
      PROMPT: 'CALL schedule_create {"prompt":"WAKEPING hub","every":"1h"}'
- extendedWaitUntil:
    visible:
      id: "turn-idle"
    timeout: 30000
- runFlow:
    file: _hub-more.yaml
    env:
      ITEM: "scheduled"
- tapOn:
    id: "hub-menu-scheduled"
- extendedWaitUntil:
    visible:
      id: "session-info-sheet"
    timeout: 10000
# The reveal (S4) opens the sheet at its LARGEST detent and scrolls the Scheduled
# section into view by ITSELF — the flow does not scroll: a scroll here would pass
# on a sheet that never revealed anything (gate runs 1795466539487 and
# 1795475314390: a Session info value pulled before the wake lacked the band, so
# no reveal was asked and the sheet opened at M on its top band,
# docs/feat/mobile-native-sheets.md, Fix round (simulator)).
- extendedWaitUntil:
    visible:
      text: ".*WAKEPING hub.*"
    timeout: 15000
