schemaVersion: 1
name: run-view-loop
version: 1
description: flow 45's run ② (docs/fix/workflows-ux.md S7) — review fails once, fix runs, review passes
steps:
  - id: collect
    run: echo collected
  - id: review
    run: "test -f review-failed-once.marker || { touch review-failed-once.marker; exit 1; }"
    on_fail: { goto: fix, max: 2 }
    next: archive
  - id: fix
    run: echo fixed
    next: review
  - id: archive
    run: echo archived
