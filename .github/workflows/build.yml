# Build the standalone `tentacle` binaries (`bun run compile`, see docs/BUILD.md).
#
# - push to main (incl. a merged PR) / manual: build every target and upload them as workflow
#   artifacts (`tentacle-<bun target>`, the same name the pod-binary lookup uses
#   under `<configDir>/bin/`).
# - push of a `v*` tag: same build, then publish a GitHub Release with the
#   binaries + SHA256SUMS. The tag must match packages/cli/package.json.
#
# Linux targets cross-compile on Ubuntu. macOS targets build on a macOS runner
# because scripts/build.ts re-signs them ad-hoc with `codesign` (without it the
# binary is SIGKILLed once moved on Apple Silicon).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a main or tag build: each one produces artifacts.
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.3" # keep in sync with package.json `engines.bun`

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `smoke`: the runner can execute this target natively.
          - { target: bun-linux-x64, os: ubuntu-latest, smoke: true }
          - { target: bun-linux-arm64, os: ubuntu-latest, smoke: false }
          - { target: bun-darwin-arm64, os: macos-latest, smoke: true }
          - { target: bun-darwin-x64, os: macos-latest, smoke: false }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bun run compile
          mv dist/tentacle "dist/tentacle-${TARGET}"

      - name: Smoke test
        if: matrix.smoke
        run: ./dist/tentacle-${{ matrix.target }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: tentacle-${{ matrix.target }}
          path: dist/tentacle-${{ matrix.target }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the CLI version
        run: |
          version="$(jq -r .version packages/cli/package.json)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match packages/cli/package.json version ${version}"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: tentacle-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          chmod +x tentacle-*
          sha256sum tentacle-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A semver pre-release tag (v0.1.0-beta.1) is published as a GitHub
          # pre-release, so it never becomes the "Latest" release.
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease}
