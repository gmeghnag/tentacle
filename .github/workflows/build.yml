# Build the standalone `tentacle` binaries (`bun run compile`, see docs/BUILD.md).
#
# - push to main (incl. a merged PR) / manual: build every target and upload them as workflow
#   artifacts (`tentacle-<bun target>`, the same name the pod-binary lookup uses
#   under `<configDir>/bin/`).
# - push of a `v*` tag: same build, then publish a GitHub Release with the
#   binaries, the macOS voice helper (`tentacle-voice-darwin`) + SHA256SUMS. The tag must match packages/cli/package.json.
#
# Linux targets cross-compile on Ubuntu. macOS targets build on a macOS runner
# because scripts/build.ts re-signs them ad-hoc with `codesign` (without it the
# binary is SIGKILLed once moved on Apple Silicon).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a main or tag build: each one produces artifacts.
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.3" # keep in sync with package.json `engines.bun`

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `smoke`: the runner can execute this target natively.
          - { target: bun-linux-x64, os: ubuntu-latest, smoke: true }
          - { target: bun-linux-arm64, os: ubuntu-latest, smoke: false }
          - { target: bun-darwin-arm64, os: macos-latest, smoke: true }
          - { target: bun-darwin-x64, os: macos-latest, smoke: false }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter '!@tentacle/mobile'

      - name: Compile
        env:
          TARGET: ${{ matrix.target }}
          # A release build reports the PLAIN version (docs/fix/dev-build-version-skew.md):
          # a `v*` tag publishes these binaries, `update` installs by exact version,
          # and the release job below refuses a tag that differs from package.json.
          # Every other build (push to main, manual) stays `+<build id>`.
          TENTACLE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
        run: |
          bun run compile
          mv dist/tentacle "dist/tentacle-${TARGET}"

      - name: Smoke test
        if: matrix.smoke
        run: ./dist/tentacle-${{ matrix.target }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: tentacle-${{ matrix.target }}
          path: dist/tentacle-${{ matrix.target }}
          if-no-files-found: error

  # The macOS voice-dictation helper (native/voice-mac, docs/feat/voice-release.md):
  # ONE universal binary (arm64 + x86_64) `tentacle-voice-darwin`, so both macOS
  # CLI targets — and an x64 shell under Rosetta — install the same asset.
  # Pinned to macos-26, not macos-latest: the package targets macOS 26
  # (SpeechTranscriber), so it needs the macOS 26 SDK (Xcode 26).
  voice:
    name: tentacle-voice-darwin
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # scripts/voice-build.ts imports only bun builtins: no `bun install` needed.
      - name: Build (universal, ad-hoc signed)
        run: |
          bun run voice:build --universal
          mv dist/tentacle-voice dist/tentacle-voice-darwin

      - name: Check slices, signature and smoke
        run: |
          archs="$(lipo -archs dist/tentacle-voice-darwin)"
          echo "archs: ${archs}"
          case " ${archs} " in *" arm64 "*) ;; *) echo "::error::no arm64 slice"; exit 1 ;; esac
          case " ${archs} " in *" x86_64 "*) ;; *) echo "::error::no x86_64 slice"; exit 1 ;; esac
          codesign --verify --verbose dist/tentacle-voice-darwin
          out="$(./dist/tentacle-voice-darwin --version)"
          echo "${out}"
          case "${out}" in "tentacle-voice "*) ;; *) echo "::error::unexpected --version: ${out}"; exit 1 ;; esac

      - uses: actions/upload-artifact@v4
        with:
          name: tentacle-voice-darwin
          path: dist/tentacle-voice-darwin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, voice]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the CLI version
        run: |
          version="$(jq -r .version packages/cli/package.json)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match packages/cli/package.json version ${version}"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: tentacle-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          # Every asset install.sh / `tentacle update` fetch must be here.
          for f in tentacle-bun-linux-x64 tentacle-bun-linux-arm64 tentacle-bun-darwin-arm64 \
            tentacle-bun-darwin-x64 tentacle-voice-darwin; do
            [ -f "$f" ] || { echo "::error::missing release asset $f"; exit 1; }
          done
          chmod +x tentacle-*
          sha256sum tentacle-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A semver pre-release tag (v0.1.0-beta.1) is published as a GitHub
          # pre-release, so it never becomes the "Latest" release.
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease}
